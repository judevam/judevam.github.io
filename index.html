<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="hero">
    <div class="wrap hero-inner">
      <p class="eyebrow">Engineering Portfolio</p>
      <h1 class="name" id="hero-name">Name</h1>
      <p class="role" id="hero-role">Role</p>
      <p class="tagline" id="hero-tagline">Tagline</p>
    </div>
  </header>

  <main>
    <section id="about">
      <div class="wrap">
        <h2 class="section-title">About</h2>
        <p class="about-text" id="about-text"></p>
        <p class="meta-line" id="about-location"></p>
      </div>
    </section>

    <section id="projects">
      <div class="wrap">
        <h2 class="section-title">Projects</h2>
        <div class="projects-list" id="projects-list"></div>
      </div>
    </section>

    <section id="skills">
      <div class="wrap">
        <h2 class="section-title">Skills</h2>
        <div class="skills-grid" id="skills-grid"></div>
      </div>
    </section>

    <section id="contact">
      <div class="wrap">
        <h2 class="section-title">Contact</h2>
        <div class="contact-links" id="contact-links"></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      &copy; <span id="footer-year"></span> — built with a plain HTML/CSS/JS stack.
    </div>
  </footer>

  <script src="content.js"></script>
  <script src="script.js"></script>
</body>
</html>
